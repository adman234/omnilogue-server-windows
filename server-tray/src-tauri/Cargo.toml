[package]
name = "omnilogue-server-tray"
# Tracks the upstream Omnilogue release this build bundles; scripts/build.ps1 stamps it.
version = "2.1.1"
description = "System tray host for the Omnilogue WebUI server on Windows"
license = "MIT"
edition = "2021"
rust-version = "1.89"
publish = false

[lib]
name = "omnilogue_server_tray_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

# Versions match upstream's src-tauri/Cargo.toml where the crate is shared, so this
# crate can move into the Omnilogue repository without a dependency bump.
[dependencies]
tauri = { version = "2.11.2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-opener = "2.5.4"
tauri-plugin-single-instance = "2.4.2"
# Same feature set as upstream: the manifest offers a raw NSIS installer, no ZIP.
tauri-plugin-updater = { version = "2.10.1", default-features = false, features = ["rustls-tls"] }
tauri-plugin-autostart = "2.5"
tauri-plugin-clipboard-manager = "2.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
base64 = "0.22"
getrandom = "0.3"
log = "0.4"

# Kills the server if the tray process dies for any reason (job object with
# KILL_ON_JOB_CLOSE), so an update or crash never leaves an orphaned server
# holding the port or the installed exe.
[target.'cfg(windows)'.dependencies]
win32job = "2"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
needless_pass_by_value = "allow"
